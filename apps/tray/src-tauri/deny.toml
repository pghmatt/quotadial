# `cargo deny check` for the tray app's workspace, which CI runs beside the core workspace's
# (deny.toml at the root) (#52). Each excepted advisory says why it cannot reach a user and what
# ends it; `.cargo/audit.toml` excepts the same for `cargo audit`.

[graph]
all-features = true

[advisories]
ignore = [
    # zip 4, which tauri-plugin-updater uses on Windows only, to unpack a zipped update. QuotaDial's
    # releases never make one: the updater installs a signed .msi, and only after its signature and
    # version check out (D-103). Ends when the plugin takes zip 9.
    { id = "RUSTSEC-2026-0367", reason = "zip: only zipped updates, which QuotaDial never ships, and only after the signature checks out" },
    { id = "RUSTSEC-2026-0368", reason = "zip: only zipped updates, which QuotaDial never ships, and only after the signature checks out" },
    { id = "RUSTSEC-2026-0369", reason = "zip: only zipped updates, which QuotaDial never ships, and only after the signature checks out" },
    # Unmaintained, not vulnerable: reached only through Tauri's Linux toolkit (gtk-rs's macros at
    # build time) and zbus 5, which notify-rust and Tauri's notification, opener and single-instance
    # plugins use on Linux. Each ends when those move on (zbus 6 takes in zvariant).
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error: unmaintained, a build-time macro of gtk-rs on Linux" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, through zbus 5 in Tauri's Linux plugins" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, through zbus 5 in Tauri's Linux plugins" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, through zbus 5 in Tauri's Linux plugins" },
]

[licenses]
# QuotaDial is MIT. Permissive licences, and MPL-2.0, whose files are used as published.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
