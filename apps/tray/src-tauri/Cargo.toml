[package]
name = "quotadial-tray"
description = "QuotaDial's tray app: the meter in the menu bar or system tray, running the daemon."
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Matt Fowkes"]
repository = "https://github.com/pghmatt/quotadial"
homepage = "https://quotadial.com"
publish = false

# Its own workspace, so the core workspace at the repository root builds without Node or a webview
# toolkit. It uses the core crates by path.
[workspace]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
quotadial-api = { path = "../../../crates/api" }
quotadial-core = { path = "../../../crates/core" }
quotadial-daemon = { path = "../../../crates/daemon" }
quotadial-providers = { path = "../../../crates/providers/all" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-notification = "2.7.0"
# Opens the links Help offers (a new GitHub issue, the changelog, mail to support) in the person's
# own browser or mail app. The window cannot ask it to open anything else.
tauri-plugin-opener = "2.7.2"
tauri-plugin-positioner = { version = "2.4.0", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "sync", "time"] }

# VoiceOver and Full Keyboard Access press the menu bar icon, which the tray library answers only
# when it is clicked; `icon_press.rs` gives the icon's button an action (#64). The versions the tray
# library already uses, so nothing new enters the build.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSButton", "NSControl", "NSMenu", "NSResponder", "NSStatusBarButton", "NSStatusItem", "NSView"] }

[dev-dependencies]
async-trait = "0.1.92"
proptest = "1.12.0"
quotadial-core = { path = "../../../crates/core", features = ["testing"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt", "sync", "time"] }

# The press test drives a real status item, on the main thread and with a menu to cancel.
[target.'cfg(target_os = "macos")'.dev-dependencies]
dispatch2 = "0.3.1"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibilityProtocols", "NSApplication", "NSMenu", "NSStatusBar"] }

# AppKit runs only on the main thread, which a test harness never gives a test.
[[test]]
name = "icon_press"
harness = false

# `deny` rather than the core workspace's `forbid`, for one exception: `icon_press`, whose module
# line in `lib.rs` carries the `#[expect]` and its reason (#64, D-114). Anything else that adds
# `unsafe` still fails to build.
[lints.rust]
unsafe_code = "deny"

# As in the core workspace.
[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
# Smaller app; the tray's work is light.
codegen-units = 1
lto = true
opt-level = "s"
strip = true
