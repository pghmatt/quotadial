name: Site deploy

# Publishes the website (site/) to Cloudflare Pages, with the key page's function beside it. Nothing
# is published until Matt adds the secret CLOUDFLARE_API_TOKEN (#51, #49), and not before a published
# release carries what the site describes (checksums, quotadial doctor, licence keys, updates): the
# gate job says which is missing and the deploy job is skipped. CI still builds every page on every
# pull request.
# CLOUDFLARE_ACCOUNT_ID, a secret, names the account the Pages project "quotadial" is in.
# QUOTADIAL_CHECKOUT_URL, a repository variable, is the Buy button's Lemon Squeezy link; without it
# the Pro page says buying opens soon.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      # The texts the site renders when it is built (#49: one source).
      - "docs/PRIVACY.md"
      - "docs/INSTALL.md"
      - "docs/CLI.md"
      - "CHANGELOG.md"
      - ".github/workflows/site-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  # A job's `if` cannot read secrets, so this one says whether the site may go out.
  gate:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is not set (#51), so the site is not published." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The site describes what the release after 0.2.0 brings; SHA256SUMS.txt is the sign of it.
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -z "$latest" ] || ! gh release view "$latest" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'SHA256SUMS.txt'; then
            echo "The newest release (${latest:-none}) carries no SHA256SUMS.txt: publish the release after 0.2.0 before the site goes live (#51)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build
        env:
          QUOTADIAL_CHECKOUT_URL: ${{ vars.QUOTADIAL_CHECKOUT_URL }}
        run: npm run build
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is set, but CLOUDFLARE_ACCOUNT_ID is missing (#51)."
            exit 1
          fi
          npx --yes wrangler@4.152.0 pages deploy out --project-name quotadial --branch main
