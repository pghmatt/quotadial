# Stub: builds the CLI on all three platforms and uploads the binaries as workflow artifacts.
# Code signing, notarization, installers and publishing a GitHub Release come later (see docs/PRD.md).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build-cli:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p quotadial --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          name="quotadial-${GITHUB_REF_NAME}-${{ matrix.target }}"
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          mkdir -p "dist/${name}"
          cp "target/${{ matrix.target }}/release/quotadial${ext}" "dist/${name}/"
          cp "target/${{ matrix.target }}/release/qd${ext}" "dist/${name}/"
          cp README.md LICENSE NOTICE "dist/${name}/"
      - uses: actions/upload-artifact@v7
        with:
          name: quotadial-${{ github.ref_name }}-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
