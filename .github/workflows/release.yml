# Builds QuotaDial for every system: the CLI on its own, and the tray app with the CLI inside it
# (a universal dmg, an msi, a deb and an AppImage). A tag such as v0.1.0 drafts a GitHub release
# with every file attached; running the workflow by hand builds the same files as workflow
# artifacts, without a release. The builds are not signed until M5 (D-065); docs/INSTALL.md says
# how to open them.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: cli (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p quotadial --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="$GITHUB_REF_NAME"; else version="dev-${GITHUB_SHA::7}"; fi
          name="quotadial-${version}-${{ matrix.target }}"
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          mkdir -p "package/${name}" dist
          cp "target/${{ matrix.target }}/release/quotadial${ext}" "package/${name}/"
          cp "target/${{ matrix.target }}/release/qd${ext}" "package/${name}/"
          cp README.md LICENSE NOTICE "package/${name}/"
          if [[ -n "$ext" ]]; then
            (cd package && 7z a "../dist/${name}.zip" "${name}" > /dev/null)
          else
            tar -czf "dist/${name}.tar.gz" -C package "${name}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: quotadial-cli-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  app:
    name: app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One dmg for Apple silicon and Intel Macs, with the CLI inside built for both.
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            bundles: apps/tray/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            args: ""
            bundles: apps/tray/src-tauri/target/release/bundle/msi/*.msi
          # The oldest supported Ubuntu, so the deb and the AppImage run on as many systems as can be.
          - name: linux-x64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            args: ""
            bundles: |
              apps/tray/src-tauri/target/release/bundle/deb/*.deb
              apps/tray/src-tauri/target/release/bundle/appimage/*.AppImage
    defaults:
      run:
        working-directory: apps/tray
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          workspaces: |
            . -> target
            apps/tray/src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tray/package-lock.json
      - name: Webview, tray and AppImage tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: Build the app and its installer
        run: |
          npm ci
          npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v7
        with:
          name: quotadial-app-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  publish:
    name: draft the release
    if: github.ref_type == 'tag'
    needs: [cli, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - name: Draft a pre-release with every file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The artifacts keep their folders (deb/, appimage/), so collect the files themselves.
          mapfile -t files < <(find dist -type f | sort)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --title "QuotaDial $GITHUB_REF_NAME" \
            --notes "Pre-release builds, not signed yet. docs/INSTALL.md says how to open them on each system."
