# Builds QuotaDial for every system: the CLI on its own, and the tray app with the CLI inside it
# (a universal dmg, an msi, a deb and an AppImage). A tag such as v0.1.0 drafts a GitHub release
# with every file attached, each download also under a name without its version (D-116), their
# SHA-256 checksums and, when the updater key is set, the latest.json the app's updater reads
# (D-103); running the workflow by hand builds the same files as workflow artifacts, without a
# release. Each kind of signing runs only when its secrets are set,
# and a build without them is unsigned as before (scripts/release-signing.sh): docs/RELEASE.md names
# every secret, and docs/INSTALL.md says how to open an unsigned build.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  cli:
    name: cli (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p quotadial --target ${{ matrix.target }}
      # The Intel build is checked on an Apple silicon runner, through Rosetta.
      - name: Rosetta, to run the Intel build
        if: matrix.target == 'x86_64-apple-darwin'
        run: /usr/bin/arch -x86_64 /usr/bin/true 2> /dev/null || sudo softwareupdate --install-rosetta --agree-to-license
      # The example build's fake provider (D-117) never ships: the built CLI's `doctor` and
      # `status --json`, run with no sign-in to find, must not name a provider `fake`.
      - name: No example provider
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          ext=""
          if [[ "$TARGET" == *windows* ]]; then ext=".exe"; fi
          scripts/no-example-provider.sh "target/${TARGET}/release/quotadial${ext}"
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="$GITHUB_REF_NAME"; else version="dev-${GITHUB_SHA::7}"; fi
          name="quotadial-${version}-${TARGET}"
          ext=""
          if [[ "$TARGET" == *windows* ]]; then ext=".exe"; fi
          mkdir -p "package/${name}" dist
          cp "target/${TARGET}/release/quotadial${ext}" "package/${name}/"
          cp "target/${TARGET}/release/qd${ext}" "package/${name}/"
          cp README.md LICENSE NOTICE "package/${name}/"
          # The shell completions and manual pages, written from the commands' definitions (D-112).
          cp -R packaging/completions packaging/man "package/${name}/"
          if [[ -n "$ext" ]]; then
            (cd package && 7z a "../dist/${name}.zip" "${name}" > /dev/null)
          else
            tar -czf "dist/${name}.tar.gz" -C package "${name}"
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: quotadial-cli-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  app:
    name: app (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One dmg for Apple silicon and Intel Macs, with the CLI inside built for both.
          # The updater's files come too when the updater key is set: the app as a .tar.gz on macOS,
          # and each file's .sig.
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin
            cli: quotadial-universal-apple-darwin
            bundles: |
              apps/tray/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
              apps/tray/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - name: windows-x64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
            args: ""
            cli: quotadial-x86_64-pc-windows-msvc.exe
            bundles: apps/tray/src-tauri/target/release/bundle/msi/*.msi*
          # The oldest supported Ubuntu, so the deb and the AppImage run on as many systems as can be.
          - name: linux-x64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
            args: ""
            cli: quotadial-x86_64-unknown-linux-gnu
            bundles: |
              apps/tray/src-tauri/target/release/bundle/deb/*.deb*
              apps/tray/src-tauri/target/release/bundle/appimage/*.AppImage*
    defaults:
      run:
        working-directory: apps/tray
    env:
      # Whether Windows is signed: a flag made from the secrets, never their values.
      WINDOWS_SIGNING: ${{ secrets.AZURE_CLIENT_ID != '' && vars.AZURE_SIGNING_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          workspaces: |
            . -> target
            apps/tray/src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tray/package-lock.json
      - name: Webview, tray and AppImage tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev patchelf
      - name: The signing tool for Azure Artifact Signing
        if: runner.os == 'Windows' && env.WINDOWS_SIGNING == 'true'
        run: cargo install artifact-signing-cli --version 0.12.0 --locked
      - name: Build the app and its installer
        shell: bash
        env:
          # Each reaches Tauri only when it is set (scripts/release-signing.sh, docs/RELEASE.md).
          QD_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          QD_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          QD_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          QD_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          QD_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          QD_APPLE_ID: ${{ secrets.APPLE_ID }}
          QD_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          QD_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          QD_AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          QD_AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          QD_AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          QD_AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          QD_AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          QD_AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          set -euo pipefail
          npm ci
          source ../../scripts/release-signing.sh
          npx tauri build ${{ matrix.args }} --config "$SIGNING_CONFIG"
      # The CLI the app carries, checked as it ships, as the cli job checks its own (D-117).
      - name: No example provider in the app's CLI
        shell: bash
        run: ../../scripts/no-example-provider.sh "src-tauri/binaries/${{ matrix.cli }}"
      - uses: actions/upload-artifact@v7
        with:
          name: quotadial-app-${{ matrix.name }}
          path: ${{ matrix.bundles }}
          if-no-files-found: error

  publish:
    name: draft the release
    if: github.ref_type == 'tag'
    needs: [cli, app]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # What the app job signed, for the notes: flags made from the secrets, never their values.
      MAC_SIGNED: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.APPLE_SIGNING_IDENTITY != '' && secrets.APPLE_ID != '' && secrets.APPLE_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
      WINDOWS_SIGNED: ${{ secrets.AZURE_CLIENT_ID != '' && vars.AZURE_SIGNING_ENDPOINT != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      # What each shipped program is made of, as CycloneDX JSON (#52): the CLI and the app, each with
      # every crate it is built from, for every system.
      - name: The software bills of materials
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo install --locked cargo-cyclonedx --version 0.5.9
          cargo cyclonedx --format json --spec-version 1.5 --target all --manifest-path crates/cli/Cargo.toml
          cargo cyclonedx --format json --spec-version 1.5 --target all --manifest-path apps/tray/src-tauri/Cargo.toml
          cp crates/cli/quotadial.cdx.json "dist/quotadial-v${version}-cli.cdx.json"
          cp apps/tray/src-tauri/quotadial-tray.cdx.json "dist/QuotaDial_${version}_app.cdx.json"
      - name: The updater's latest.json, the copies without the version and every file's checksum
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          # The notes are the version's section of CHANGELOG.md (D-101); a tag with none fails here.
          scripts/release-notes.sh "$version" > changes.md
          # The app the updater installs on macOS is named for its version, as the dmg is.
          find dist -name 'QuotaDial.app.tar.gz*' -print0 | while IFS= read -r -d '' file; do
            mv "$file" "$(dirname "$file")/QuotaDial_${version}_universal.app.tar.gz${file##*.app.tar.gz}"
          done
          # Only a release built with the updater key has signatures, and so a latest.json.
          node scripts/updater-manifest.mjs dist "$version" changes.md dist/latest.json
          # Each of the eight downloads again, signed and notarized as it is, under a name without the
          # version, which releases/latest/download/ answers from the newest full release (D-116).
          # After latest.json, which names the versioned files; before the checksums, which list both.
          node scripts/latest-names.mjs dist "$version"
          # Named as the release names them, so `sha256sum -c` runs in a folder of downloads.
          find dist -type f -print0 | while IFS= read -r -d '' file; do
            (cd "$(dirname "$file")" && sha256sum "$(basename "$file")")
          done | sort -k 2 > SHA256SUMS.txt
          mv SHA256SUMS.txt dist/
      - name: Draft a pre-release with every file
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$MAC_SIGNED/$WINDOWS_SIGNED" in
            true/true) signed="Signed and notarized for macOS, and signed for Windows." ;;
            true/false) signed="Signed and notarized for macOS. The Windows installer is not signed yet: docs/INSTALL.md says how to open it." ;;
            false/true) signed="Signed for Windows. The macOS app is not signed yet: docs/INSTALL.md says how to open it." ;;
            *) signed="Pre-release builds, not signed yet. docs/INSTALL.md says how to open them on each system." ;;
          esac
          {
            echo "$signed"
            echo
            cat changes.md
          } > notes.md
          # The artifacts keep their folders (deb/, appimage/), so collect the files themselves.
          mapfile -t files < <(find dist -type f | sort)
          gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --title "QuotaDial $GITHUB_REF_NAME" \
            --notes-file notes.md
