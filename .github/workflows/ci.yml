name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  # The tray app is its own Cargo workspace (apps/tray/src-tauri), built after its window and the
  # CLI it bundles, which Tauri needs before it compiles.
  tray:
    name: tray (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/tray
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/tray/src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tray/package-lock.json
      - name: Webview and tray libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Window (types, build, size budget)
        run: |
          npm ci
          npm run build
      - name: The CLI the app bundles
        run: npm run cli
      - name: Format
        working-directory: apps/tray/src-tauri
        run: cargo fmt -- --check
      - name: Clippy
        working-directory: apps/tray/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: apps/tray/src-tauri
        run: cargo test --locked

  # docs/PUBLIC_SCOPE.md: the full PRD stays private; only the generated public copy is committed.
  public-scope:
    name: public-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The private PRD is never tracked
        run: |
          if git ls-files | grep -qix 'docs/prd\.md'; then
            echo "::error file=docs/PRD.md::docs/PRD.md is private and must never be committed. See docs/PUBLIC_SCOPE.md."
            exit 1
          fi
      - name: Lint scripts
        run: shellcheck scripts/*.sh
      - name: The public PRD has no private content
        run: scripts/public-prd.sh --check

  # The single status check that branch protection on main requires, so the jobs above can change
  # without touching the protection rule.
  ci-success:
    name: ci-success
    if: always()
    needs: [check, tray, public-scope]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          test "${{ needs.check.result }}" = "success"
          test "${{ needs.tray.result }}" = "success"
          test "${{ needs.public-scope.result }}" = "success"
