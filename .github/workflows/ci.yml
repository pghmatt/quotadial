name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Weekly too, so an advisory published about a dependency fails CI even when nothing changed.
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      # Only a debug build trusts the licence test key, whose private half is public (D-099).
      - name: A release build trusts only QuotaDial's licence key
        if: runner.os == 'Linux'
        run: cargo test --release --locked -p quotadial-core only_a_debug_build_trusts_the_test_key

  # The tray app is its own Cargo workspace (apps/tray/src-tauri), built after its window and the
  # CLI it bundles, which Tauri needs before it compiles.
  tray:
    name: tray (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        working-directory: apps/tray
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            apps/tray/src-tauri -> target
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/tray/package-lock.json
      - name: Webview and tray libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: Window (types, build, size budget, contrast)
        run: |
          npm ci
          npm run build
      # The built window in Chrome, which each runner has: keyboard, screen readers, zoom to 200%,
      # long names and reduced motion (#52, D-110).
      - name: Window (keyboard, screen readers, zoom, motion)
        run: npm run check:window
      - name: The CLI the app bundles
        run: npm run cli
      - name: Format
        working-directory: apps/tray/src-tauri
        run: cargo fmt -- --check
      - name: Clippy
        working-directory: apps/tray/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        working-directory: apps/tray/src-tauri
        run: cargo test --locked

  # The website's key page (site/, D-102): its function turns a paid receipt's key into a licence key
  # signed as QuotaDial checks them, tested against Lemon Squeezy's documented answers.
  site:
    name: site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: Types
        run: npm run check
      - name: Test
        run: npm test

  # docs/PUBLIC_SCOPE.md: the full PRD stays private; only the generated public copy is committed.
  public-scope:
    name: public-scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: The private PRD is never tracked
        run: |
          if git ls-files | grep -qix 'docs/prd\.md'; then
            echo "::error file=docs/PRD.md::docs/PRD.md is private and must never be committed. See docs/PUBLIC_SCOPE.md."
            exit 1
          fi
      - name: Lint scripts
        run: shellcheck scripts/*.sh
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test scripts
        run: node --test scripts/*.test.mjs
      - name: The public PRD has no private content
        run: scripts/public-prd.sh --check
      # What QuotaDial reads and sends is one text (D-106): the README carries docs/PRIVACY.md.
      - name: The README's privacy section is docs/PRIVACY.md
        run: scripts/privacy.sh --check
      # A release's notes come from its section of CHANGELOG.md (D-101), so the version being built
      # must have one.
      - name: The changelog has notes for this version
        run: scripts/release-notes.sh "$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)" > /dev/null

  # The supply chain (#52, D-109): known vulnerabilities (cargo audit), and licences, advisories and
  # where crates come from (cargo deny), for both Rust workspaces. Each exception is in deny.toml
  # and .cargo/audit.toml with why it cannot reach a user.
  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2,cargo-audit@0.22.2
      - name: cargo deny, the core workspace
        run: cargo deny check
      - name: cargo deny, the tray app
        working-directory: apps/tray/src-tauri
        run: cargo deny check
      - name: cargo audit, the core workspace
        run: cargo audit
      - name: cargo audit, the tray app
        working-directory: apps/tray/src-tauri
        run: cargo audit

  # The single status check that branch protection on main requires, so the jobs above can change
  # without touching the protection rule.
  ci-success:
    name: ci-success
    if: always()
    needs: [check, tray, site, public-scope, supply-chain]
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed
        run: |
          test "${{ needs.check.result }}" = "success"
          test "${{ needs.tray.result }}" = "success"
          test "${{ needs.site.result }}" = "success"
          test "${{ needs.public-scope.result }}" = "success"
          test "${{ needs.supply-chain.result }}" = "success"
