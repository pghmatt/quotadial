name: Feature request
description: Suggest something QuotaDial should do. For a new AI provider, use "Provider request".
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The job you need done and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: How you picture it working.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where should it live?
      multiple: true
      options:
        - CLI
        - Tray app
        - Local HTTP API
        - MCP server
        - SKILL.md
        - Not sure
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
