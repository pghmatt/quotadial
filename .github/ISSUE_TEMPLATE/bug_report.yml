name: Bug report
description: Something in QuotaDial is broken or shows the wrong numbers.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting this. **Never paste tokens, cookies, API keys, or the contents of
        `auth.json` or `.credentials.json`.** Redact account emails and IDs if you prefer.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you saw, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `quotadial status --json`
        2. ...
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where did it happen?
      multiple: true
      options:
        - CLI
        - Tray app
        - Local HTTP API
        - MCP server
        - SKILL.md
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Provider
      multiple: true
      options:
        - Claude
        - ChatGPT / Codex
        - Not provider-specific
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: QuotaDial version
      description: Output of `quotadial --version`.
  - type: textarea
    id: output
    attributes:
      label: Output or logs
      description: Redact anything that looks like a token or key before pasting.
      render: shell
