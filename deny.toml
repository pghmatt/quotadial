# `cargo deny check`, which CI runs on this workspace and on the tray app's
# (apps/tray/src-tauri/deny.toml) (#52): every crate's licence is one QuotaDial may ship, every
# RustSec advisory is fixed or excepted here with the reason, and crates come only from crates.io.

[graph]
all-features = true

[advisories]
# Vulnerable, unmaintained, unsound or yanked: each fails unless excepted here with why.
ignore = []

[licenses]
# QuotaDial is MIT. Permissive licences, and MPL-2.0, whose files are used as published.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate are common in a tree this size and harm nothing but build time.
multiple-versions = "allow"
wildcards = "deny"
# The workspace's own crates point at each other by path.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
