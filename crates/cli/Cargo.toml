[package]
name = "quotadial"
description = "QuotaDial command-line interface: quotadial, alias qd."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
autobins = false
default-run = "quotadial"

[lib]
name = "quotadial_cli"
path = "src/lib.rs"

[[bin]]
name = "quotadial"
path = "src/main.rs"

[[bin]]
name = "qd"
path = "src/bin/qd.rs"

[dependencies]
chrono.workspace = true
clap.workspace = true
quotadial-core.workspace = true
quotadial-provider-claude.workspace = true
quotadial-provider-codex.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
