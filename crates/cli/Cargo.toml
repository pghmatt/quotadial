[package]
name = "quotadial"
description = "QuotaDial command-line interface: quotadial, alias qd."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true
autobins = false
default-run = "quotadial"

[lib]
name = "quotadial_cli"
path = "src/lib.rs"

[[bin]]
name = "quotadial"
path = "src/main.rs"

[[bin]]
name = "qd"
path = "src/bin/qd.rs"

[features]
# The example build (D-117): the fake provider in place of Claude and Codex, with this copy's own
# folders and port. In no default and no release; `cargo test --workspace --features fake` turns it
# on here, in the provider list and in core together, and so do the tray app's example build and
# `npm run cli -- --fake`.
fake = ["quotadial-providers/fake"]
# GitHub Copilot (D-127), off by default until #51's live check: `cargo run -p quotadial --features
# copilot -- status` shows it, and the CLI's tests expect it in that build.
copilot = ["quotadial-providers/copilot"]

[dependencies]
chrono.workspace = true
clap.workspace = true
quotadial-api.workspace = true
quotadial-core.workspace = true
quotadial-daemon.workspace = true
quotadial-providers.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-std", "io-util", "rt", "time", "signal", "sync", "macros"] }

[dev-dependencies]
async-trait.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
roff.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
