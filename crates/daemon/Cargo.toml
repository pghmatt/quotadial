[package]
name = "quotadial-daemon"
description = "The QuotaDial daemon: one poller shared by every consumer, and SQLite history."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
# JSON Schema for the history and alert rules the local API sends (see quotadial-core's).
schema = ["dep:schemars", "quotadial-core/schema"]

[dependencies]
chrono.workspace = true
dirs.workspace = true
quotadial-core.workspace = true
quotadial-cost.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
schemars = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
async-trait.workspace = true
proptest.workspace = true
quotadial-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "test-util"] }

[lints]
workspace = true
