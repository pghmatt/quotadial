[package]
name = "quotadial-core"
description = "Normalized usage model and the Provider trait shared by every QuotaDial surface."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[features]
# Helpers for other crates' tests: arbitrary JSON for the property tests over parsers (#52).
testing = ["dep:proptest"]
# JSON Schema for the types the local API sends, from which a test writes docs/openapi.json.
schema = ["dep:schemars"]
# The example build (D-117): this copy keeps its own data folder, cache folder and API port
# (`copy`). quotadial-providers' `fake` feature turns it on with the fake provider; no release does.
fake = []

[dependencies]
async-trait.workspace = true
base64.workspace = true
chrono.workspace = true
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
proptest = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true
