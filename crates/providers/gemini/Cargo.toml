[package]
name = "quotadial-provider-gemini"
description = "Gemini CLI for QuotaDial: sees that it is signed in and says why there are no numbers. It sends nothing."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

# No HTTP client, here or in a dev-dependency: this provider never asks anyone (D-118), as its
# `asks()` says. quotadial-providers' tests hold every provider that asks no one to that (P-021).
[dependencies]
async-trait.workspace = true
quotadial-core.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true

[dev-dependencies]
proptest.workspace = true
quotadial-core = { workspace = true, features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
