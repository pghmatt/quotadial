<!doctype html>
<!-- QuotaDial's share card, 1200x630: the mark and name, the line, and the week's curve meeting
     high water before the reset. Private: rendered by scripts/brand.mjs with the site's own fonts
     and colours, never served by the site. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../node_modules/@fontsource-variable/sofia-sans/index.css">
<link rel="stylesheet" href="../../../node_modules/@fontsource-variable/sofia-sans-condensed/index.css">
<link rel="stylesheet" href="../../../node_modules/@fontsource-variable/sofia-sans-condensed/wght-italic.css">
<style>
  html, body { margin: 0; }
  body {
    width: 1200px; height: 630px; overflow: hidden; position: relative;
    background: #f6f9fb; color: #0c1d2b; font-family: "Sofia Sans Variable", sans-serif;
  }
  .band { position: absolute; left: 0; right: 0; bottom: 0; height: 250px; background: #dcedf6; }
  .lockup { position: absolute; left: 72px; top: 64px; display: flex; align-items: center; gap: 24px; }
  .lockup img { width: 112px; height: 112px; }
  .name { font-family: "Sofia Sans Condensed Variable", sans-serif; font-weight: 800; font-size: 104px; line-height: 1; letter-spacing: -0.01em; }
  .line { position: absolute; left: 72px; top: 214px; width: 760px; font-size: 40px; line-height: 1.2; color: #3b5466; font-weight: 500; }
  svg { position: absolute; left: 0; bottom: 0; }
  .label { font-family: "Sofia Sans Condensed Variable", sans-serif; font-style: italic; font-size: 26px; }
</style>
</head>
<body>
  <div class="band"></div>
  <div class="lockup"><img src="app-icon.svg" alt=""><span class="name">QuotaDial</span></div>
  <p class="line">Claude and Codex plan limits, with when each resets and whether you run out first</p>
  <svg width="1200" height="250" viewBox="0 0 1200 250">
    <line x1="72" x2="1128" y1="62" y2="62" stroke="#0c1d2b" stroke-width="3" stroke-dasharray="12 10"/>
    <text x="72" y="48" class="label" fill="#0c1d2b" font-weight="600">High water: 100%</text>
    <line x1="1020" x2="1020" y1="40" y2="226" stroke="#3b5466" stroke-width="3"/>
    <text x="1008" y="244" class="label" fill="#3b5466" text-anchor="end">Resets Thu 06:00</text>
    <polygon points="72,226 72,214 200,200 330,170 450,150 560,118 660,104 740,92 740,226" fill="#b3d7ec"/>
    <polyline points="72,214 200,200 330,170 450,150 560,118 660,104 740,92" fill="none" stroke="#2f74a6" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="740" y1="92" x2="830" y2="62" stroke="#a8005f" stroke-width="5" stroke-dasharray="10 9" stroke-linecap="round"/>
    <circle cx="830" cy="62" r="10" fill="#a8005f"/>
    <text x="846" y="100" class="label" fill="#a8005f" font-weight="700">Runs out Tue 18:40</text>
  </svg>
  <script>
    Promise.all([document.fonts.ready, ...[...document.images].map((img) => img.decode())]).then(() => (document.body.dataset.ready = "1"));
  </script>
</body>
</html>
