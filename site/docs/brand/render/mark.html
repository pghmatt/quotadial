<!doctype html>
<!-- Renders QuotaDial's mark (the app icon) at ?size=N for the favicon set; ?bleed=1 fills the
     square with the tile colour, for the Apple touch icon, which iOS rounds itself. Private: run by
     scripts/brand.mjs, never served by the site. -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  .bleed { background: #1c1c1e; }
  img { display: block; }
</style>
</head>
<body>
<script>
  const params = new URLSearchParams(location.search);
  const size = Number(params.get("size") || 512);
  const bleed = params.get("bleed") === "1";
  const img = new Image(size, size);
  img.src = "app-icon.svg";
  if (bleed) {
    document.body.className = "bleed";
    img.width = img.height = Math.round(size * 1.14);
    img.style.margin = `${-Math.round(size * 0.07)}px`;
  }
  document.body.style.width = document.body.style.height = `${size}px`;
  document.body.style.overflow = "hidden";
  document.body.append(img);
  img.decode().then(() => (document.body.dataset.ready = "1"));
</script>
</body>
</html>
