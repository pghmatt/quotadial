<!doctype html>
<!-- The mark sheet: the mark at 16, 32, 64 and 256 px on the light and dark grounds, to check the
     smallest sizes by eye. Private: rendered by scripts/brand.mjs into docs/brand/mark-sheet.png. -->
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../../node_modules/@fontsource-variable/sofia-sans-condensed/index.css">
<style>
  html, body { margin: 0; }
  body { width: 960px; font-family: "Sofia Sans Condensed Variable", sans-serif; }
  .row { display: flex; align-items: flex-end; gap: 40px; padding: 32px 40px; }
  .light { background: #f6f9fb; color: #0c1d2b; }
  .dark { background: #08131d; color: #dce9f2; }
  figure { margin: 0; display: grid; justify-items: center; gap: 8px; font-size: 18px; }
  .lockup { display: flex; align-items: center; gap: 10px; font-weight: 750; font-size: 30px; }
</style>
</head>
<body>
  <div class="row light"></div>
  <div class="row dark"></div>
  <script>
    for (const row of document.querySelectorAll(".row")) {
      for (const size of [16, 32, 64, 256]) {
        row.insertAdjacentHTML("beforeend", `<figure><img src="app-icon.svg" width="${size}" height="${size}" alt=""><figcaption>${size} px</figcaption></figure>`);
      }
      row.insertAdjacentHTML("beforeend", `<figure><span class="lockup"><img src="app-icon.svg" width="30" height="30" alt="">QuotaDial</span><figcaption>header</figcaption></figure>`);
    }
    Promise.all([document.fonts.ready, ...[...document.images].map((img) => img.decode())]).then(() => (document.body.dataset.ready = "1"));
  </script>
</body>
</html>
