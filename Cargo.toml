[workspace]
resolver = "3"
# The tray app in apps/tray/src-tauri is its own workspace, so this one builds without Node or a
# webview toolkit.
exclude = ["apps/tray/src-tauri"]
members = [
    "crates/core",
    "crates/cost",
    "crates/poll",
    "crates/daemon",
    "crates/providers/claude",
    "crates/providers/codex",
    "crates/providers/all",
    "crates/api",
    "crates/cli",
    "crates/issue",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Matt Fowkes"]
repository = "https://github.com/pghmatt/quotadial"
homepage = "https://quotadial.com"
publish = false

[workspace.dependencies]
quotadial-core = { path = "crates/core" }
quotadial-cost = { path = "crates/cost" }
quotadial-poll = { path = "crates/poll" }
quotadial-daemon = { path = "crates/daemon" }
quotadial-api = { path = "crates/api" }
quotadial-provider-claude = { path = "crates/providers/claude" }
quotadial-provider-codex = { path = "crates/providers/codex" }
quotadial-providers = { path = "crates/providers/all" }
async-trait = "0.1.92"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
base64 = "0.22.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
clap_mangen = "0.3.3"
dirs = "7.0.0"
# Licence keys are checked with Ed25519 signatures (D-099); only verifying and signing are needed.
ed25519-dalek = { version = "3.0.0", default-features = false, features = ["zeroize"] }
getrandom = "0.4.3"
# SIMD search for the words that mark a usage line in multi-gigabyte logs.
memchr = "2.8.3"
proptest = "1.12.0"
# rustls with the operating system's certificate store; no OpenSSL to install on Linux.
# SQLite compiled in, so no system library is needed on any platform.
rusqlite = { version = "0.40.2", features = ["bundled"] }
reqwest = { version = "0.13.5", default-features = false, features = ["default-tls", "http2", "system-proxy"] }
roff = "1.1.1"
# JSON Schema from the API's types, for docs/openapi.json; only tests build it (the `schema`
# features), and the API serves the committed file.
schemars = { version = "1.2.3", default-features = false, features = ["derive", "std", "chrono04"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
unicode-normalization = "0.1.26"
wiremock = "0.6.5"
zeroize = { version = "1.9.1", features = ["serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# The default clippy groups (correctness, suspicious, style, complexity, perf) stay on,
# and CI runs clippy with `-D warnings`, so any warning fails the build.
[workspace.lints.clippy]
# Stray debug output is how tokens end up in logs.
dbg_macro = "deny"
# Unfinished code returns `Status::Unsupported`; it never panics.
todo = "deny"
unimplemented = "deny"
# Libraries return data. Only the CLI prints, and it opts out at its crate root.
print_stdout = "warn"
print_stderr = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
